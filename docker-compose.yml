services:
    # Database
    db:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
        volumes:
            - ./db-data:/var/lib/mysql

    # phpmyadmin
    phpmyadmin:
        depends_on:
            - db
        image: phpmyadmin/phpmyadmin
        ports:
            # 8092/8093 are used by WP-Rest-Control
            - '8095:80'
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: password

    # wordpress
    wordpress:
        depends_on:
            - db
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - 8094:80
        volumes:
            # WordPress itself lives in a volume, so WooCommerce survives
            # recreating the container
            - wordpress:/var/www/html
            - .:/var/www/html/wp-content/plugins/circle3-order-archive-cleaner-for-woocommerce
        environment:
            - WORDPRESS_DB_HOST=db:3306
            - WORDPRESS_DB_USER=wordpress
            - WORDPRESS_DB_PASSWORD=wordpress
            - |
                WORDPRESS_CONFIG_EXTRA=
                define('WP_HOME', 'http://localhost:8094');
                define('WP_SITEURL', 'http://localhost:8094');

volumes:
    wordpress:
